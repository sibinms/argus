# Argus reviewing its own PRs. See .argus/config.yml.example for all options.

# active: posts inline comments + a verdict on the PR (what we want here).
# Switch to shadow to get a job-summary report without commenting.
mode: active

# DashScope / Qwen (matches the DASHSCOPE_API_KEY passed by the workflow).
# Switched off DeepSeek after its account balance ran out and every
# self-review since 2026-08-21 failed with 402 Insufficient Balance; before
# that, off Gemini's free tier, which 429/503'd under this repo's own
# parallel-lens load (planner + 8 lenses + curator, ~10 concurrent calls).
# qwen-flash for the lens (cheap, ~1M context, over-report), qwen3.8-max for
# the curator (strongest Qwen with a long context — plain qwen-max is capped
# at 30k tokens in litellm's table, which would truncate the curator's
# context on any medium PR). Both are in litellm's pricing table, so the
# per-model token budget applies. To use another provider, change these model strings and pass
# that provider's key via the workflow's env: block instead.
models:
  lens: dashscope/qwen-flash
  curator: dashscope/qwen3.8-max

lenses:
  - security
  - tests
  - error_handling
  - contracts
  - correctness
  - deleted_code
  - reuse
  - efficiency

# Deterministic, model-free checks (run alongside the lenses, skip the curator).
checks:
  - comments

context:
  ignore_globs:
    - "*.lock"
    - "*.min.js"
    - "*/migrations/*"
    - "package-lock.json"
    - "yarn.lock"
    - "pnpm-lock.yaml"
    # Eval fixtures are intentionally-buggy synthetic examples (that's the
    # point of them) — without this, Argus reviews its own test data as if
    # it were real application code and flags the deliberate bug in it.
    - "eval/seed_bugs/*"

posting:
  min_confidence: medium
  show_dropped_reasoning: true
  # We enabled "Allow GitHub Actions to approve pull requests" on this repo,
  # so Argus posts a real Approved review on a clean PR.
  approve_reviews: true
